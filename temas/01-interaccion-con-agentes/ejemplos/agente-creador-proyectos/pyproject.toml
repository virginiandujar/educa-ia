[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-creador-proyectos"
version = "0.1.0"
description = "Ejemplo didáctico de un agente que crea proyectos Python seguros y repetibles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crear-proyecto = "project_creator_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
