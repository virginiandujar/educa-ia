[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-ia-creador-proyectos"
version = "0.1.0"
description = "Agente didáctico que usa un modelo de IA y herramientas limitadas para crear proyectos Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai"]

[project.scripts]
agente-ia-proyectos = "ai_project_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
